<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG branch chooser: long-run fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf8fb;
  --surface: #ffffff;
  --ink: #1f1a2e;
  --muted: #5f587a;
  --line: #e3dbec;
  --hema: #3f3a8f;
  --on-hema: #ffffff;
  --hema-soft: #e8e6f7;
  --eos: #b62d58;
  --eos-soft: #fbe4ec;
  --ochre: #86560a;
  --ochre-soft: #fbefd2;
  --ok: #24704f;
  --ok-soft: #dcf1e6;
  --f-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121f; --surface: #1e1a2f; --ink: #ece8f8; --muted: #aaa3c4; --line: #352e4e;
    --hema: #a9a3f7; --on-hema: #15121f; --hema-soft: #2a2650;
    --eos: #ff8fb1; --eos-soft: #3b2030; --ochre: #e9b859; --ochre-soft: #3a2f14;
    --ok: #74d6a8; --ok-soft: #1d3a2e;
  }
}
:root[data-theme="dark"] {
  --bg: #15121f; --surface: #1e1a2f; --ink: #ece8f8; --muted: #aaa3c4; --line: #352e4e;
  --hema: #a9a3f7; --on-hema: #15121f; --hema-soft: #2a2650;
  --eos: #ff8fb1; --eos-soft: #3b2030; --ochre: #e9b859; --ochre-soft: #3a2f14;
  --ok: #74d6a8; --ok-soft: #1d3a2e;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-text); font-size: 17px; line-height: 1.6;
}
h1, h2, h3, h4, button, .pill span, label, legend, th, .tabs, .stepname, .tag, .sc, .rk, .brand, select, input, output, summary b {
  font-family: var(--f-ui);
}
h1 { font-size: clamp(32px, 5.2vw, 54px); line-height: 1.04; letter-spacing: -0.025em; margin: 0 0 16px; font-weight: 700; }
h2 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; letter-spacing: -0.015em; margin: 8px 0 14px; font-weight: 700; }
h3 { font-size: 19px; margin: 0 0 8px; font-weight: 600; line-height: 1.25; }
h3.sub { margin: 30px 0 4px; font-size: 20px; }
h4 { font-size: 14px; margin: 14px 0 6px; font-weight: 600; color: var(--muted); }
p { margin: 0 0 12px; }
a { color: var(--hema); }
.ref { text-decoration: none; font-size: 0.82em; vertical-align: baseline; padding: 0 1px; }
.ref:hover { text-decoration: underline; }
.lede { font-size: 19px; max-width: 62ch; }
.intro { max-width: 62ch; }
.fine { font-size: 14px; color: var(--muted); max-width: 66ch; }
.small { font-size: 15px; }
.muted { color: var(--muted); }
.warn { color: var(--ochre); }
.hint { font-size: 14px; color: var(--muted); margin: 4px 0 10px; max-width: 70ch; }
:focus-visible { outline: 3px solid var(--eos); outline-offset: 2px; border-radius: 4px; }

/* chrome */
#chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
.brand { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.linklike { background: none; border: 0; padding: 0; color: var(--hema); cursor: pointer; font-size: inherit; font-weight: inherit; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 8px 12px; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--eos); font-weight: 600; }
.tab.theme { font-size: 13px; }
.steps { display: flex; gap: 4px; padding: 0 20px; }
.seg { flex: 1; height: 8px; border: 0; padding: 0; border-radius: 4px; background: var(--line); cursor: pointer; min-width: 10px; }
.seg.past { background: var(--hema-soft); box-shadow: inset 0 0 0 1px var(--hema); }
.seg.on { background: var(--hema); }
.stepname { padding: 6px 20px 10px; font-size: 14px; font-weight: 600; }
.stepname span { font-weight: 400; color: var(--muted); margin-left: 8px; }

main { padding: 20px 20px 80px; }
.narrow { max-width: 760px; margin: 0 auto; }
.wide { max-width: 1120px; margin: 0 auto; }

/* buttons */
.btn { font-size: 16px; padding: 10px 20px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--hema); }
.btn.primary { background: var(--hema); color: var(--on-hema); border-color: var(--hema); font-weight: 600; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--hema); text-decoration: underline; padding-left: 4px; padding-right: 4px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 18px 0; }
.nav { display: flex; justify-content: space-between; margin-top: 34px; gap: 12px; }

/* start */
.start .trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; margin: 30px 0 10px; }
.start .trio h3 { color: var(--hema); }
.start .trio p { font-size: 15.5px; }

/* form primitives */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.item { padding: 16px 0 18px; border-bottom: 1px solid var(--line); }
fieldset > legend { float: left; width: 100%; padding: 0 0 10px; font-size: 17px; font-family: var(--f-text); font-weight: 500; }
fieldset > legend + * { clear: both; }
legend small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills.col { flex-direction: column; align-items: flex-start; }
.pill { position: relative; display: inline-block; }
.pill input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.pill span { display: inline-block; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 15px; background: var(--surface); line-height: 1.25; }
.pill:hover span { border-color: var(--hema); }
.pill input:checked + span { background: var(--hema); border-color: var(--hema); color: var(--on-hema); }
.pill input:focus-visible + span { outline: 3px solid var(--eos); outline-offset: 2px; }
.pill.noidea span { border-style: dashed; color: var(--muted); }
.pill.noidea input:checked + span { background: var(--muted); border-color: var(--muted); color: var(--bg); }
.pills.sm .pill span { padding: 5px 11px; font-size: 14px; }
.picks { display: grid; gap: 10px; max-width: 520px; }
.sel { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; }
.sel > span { font-family: var(--f-ui); font-weight: 700; color: var(--hema); }
select, input[type="number"] { font-size: 16px; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }
.checks { display: grid; gap: 8px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-family: var(--f-text); font-size: 16.5px; cursor: pointer; }
.chk input { margin-top: 6px; accent-color: var(--hema); width: 17px; height: 17px; }
.rankrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 420px; margin-top: 14px; }
.rankrow label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
textarea { width: 100%; font-family: var(--f-text); font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.exptable { display: grid; gap: 4px; }
.exprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15.5px; }

/* best-worst */
fieldset.set { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 16px 6px; margin: 0 0 18px; background: var(--surface); }
fieldset.set > legend { float: none; width: auto; padding: 0 8px; font-family: var(--f-ui); font-weight: 600; font-size: 14px; color: var(--muted); }
.setrow { display: grid; grid-template-columns: 1fr 64px 64px; align-items: center; gap: 4px; padding: 9px 0; border-top: 1px solid var(--line); }
.setrow.head { border-top: 0; padding: 0; font-family: var(--f-ui); font-size: 13px; color: var(--muted); text-align: center; }
.setrow .lab b { font-family: var(--f-ui); font-weight: 600; display: block; line-height: 1.25; }
.setrow .lab small { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; }
.rd { position: relative; justify-self: center; width: 32px; height: 32px; }
.rd input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.rd span { display: block; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); }
.rd:hover span { border-color: var(--hema); }
.rd input:checked + span { background: var(--hema); border-color: var(--hema); box-shadow: inset 0 0 0 5px var(--surface); }
.rd.worst:hover span { border-color: var(--eos); }
.rd.worst input:checked + span { background: var(--eos); border-color: var(--eos); box-shadow: inset 0 0 0 5px var(--surface); }
.rd input:focus-visible + span { outline: 3px solid var(--eos); outline-offset: 2px; }

/* results */
.notice { background: var(--ochre-soft); color: var(--ink); padding: 10px 14px; border-radius: 10px; font-size: 15.5px; max-width: 80ch; }
.weights { margin: 24px 0; padding: 18px 20px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; }
.w label { display: block; }
.w label b { font-size: 15px; display: block; }
.w label small { display: block; font-family: var(--f-text); font-size: 13px; color: var(--muted); line-height: 1.35; margin: 2px 0 6px; min-height: 3.6em; }
.wctl { display: flex; align-items: center; gap: 10px; }
.wctl input[type="range"] { flex: 1; accent-color: var(--hema); }
.wctl output { min-width: 42px; text-align: right; font-weight: 600; font-size: 15px; }
.verdict { background: var(--hema-soft); border-radius: 12px; padding: 14px 18px; margin: 10px 0 20px; }
.verdict p { margin: 0; }

.table { border-top: 2px solid var(--ink); }
.thead { display: grid; grid-template-columns: 34px minmax(160px, 1.1fr) minmax(200px, 2fr) 44px 60px 200px; gap: 12px; padding: 8px 8px; font-family: var(--f-ui); font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
details.row { border-bottom: 1px solid var(--line); }
details.row summary { list-style: none; display: grid; grid-template-columns: 34px minmax(160px, 1.1fr) minmax(200px, 2fr) 44px 60px 200px; gap: 12px; align-items: center; padding: 12px 8px; cursor: pointer; }
details.row summary::-webkit-details-marker { display: none; }
details.row summary:hover { background: var(--hema-soft); }
details.row[open] > summary { background: var(--hema-soft); }
.rk { font-weight: 700; font-size: 20px; color: var(--hema); text-align: center; }
.nm b { font-weight: 600; font-size: 16.5px; line-height: 1.2; display: block; }
.nm i { font-style: normal; font-size: 13px; color: var(--muted); font-family: var(--f-ui); }
.sc { font-weight: 700; font-size: 20px; text-align: right; }
.strip { position: relative; height: 16px; display: block; background: linear-gradient(var(--line), var(--line)) center / 100% 2px no-repeat; }
.strip::before, .strip::after { content: ""; position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--line); }
.strip::before { left: 50%; }
.strip::after { left: 100%; }
.strip .band { position: absolute; top: 3px; height: 10px; background: var(--hema-soft); border: 1.5px solid var(--hema); border-radius: 4px; }
.strip .dot { position: absolute; top: 1px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--hema); border: 2px solid var(--surface); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--line); color: var(--ink); white-space: nowrap; }
.tag.clash, .tag.hi { background: var(--eos-soft); color: var(--eos); }
.tag.verify, .tag.mid { background: var(--ochre-soft); color: var(--ochre); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.detail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 6px 12px 22px 46px; background: var(--surface); }
.detail ul { margin: 0 0 8px; padding-left: 20px; font-size: 15px; }
.detail li { margin-bottom: 4px; }
.detail ul.neg li::marker { color: var(--eos); }
.mb { display: grid; grid-template-columns: 130px 1fr 32px; gap: 8px; align-items: center; font-family: var(--f-ui); font-size: 13px; margin-bottom: 5px; }
.mb .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: block; }
.mb .fill { display: block; height: 100%; background: var(--hema); }
.mb b { text-align: right; font-weight: 600; }

.panel { margin: 36px 0; padding-top: 6px; border-top: 2px solid var(--ink); }
.panel h3 { margin-top: 12px; font-size: 22px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 15.5px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 600; }
.tbl.wrapt td { font-size: 15px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px; }
.lcol ul { padding-left: 18px; margin: 4px 0; }
.cmpsel { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.cmpsel label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 220px; }
.difflist { padding-left: 20px; font-size: 15.5px; }
.steps-list li { margin-bottom: 8px; max-width: 74ch; }
textarea.sum { font-size: 14px; }

/* method */
.prose h2 { margin-top: 34px; }
.prose li { margin-bottom: 8px; }
.scroll { overflow-x: auto; max-width: 100%; }
.sources { padding-left: 26px; }
.sources li { margin-bottom: 10px; font-size: 15.5px; }
.sources small { color: var(--muted); font-size: 14px; }
.sources li.flash { background: var(--hema-soft); border-radius: 6px; }

/* assumptions */
.subtabs { display: flex; gap: 2px; flex-wrap: wrap; margin: 16px 0 6px; border-bottom: 1px solid var(--line); }
table.grid { border-collapse: collapse; font-size: 14px; }
table.grid th, table.grid td { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: center; }
table.grid th { font-weight: 600; font-size: 12.5px; color: var(--muted); }
table.grid tbody th { text-align: left; color: var(--ink); white-space: nowrap; padding-right: 12px; font-size: 14px; position: sticky; left: 0; background: var(--bg); }
input.cell { width: 46px; padding: 5px 4px; text-align: center; font-size: 14px; }
input.cell.ed { background: var(--ochre-soft); border-color: var(--ochre); font-weight: 700; }
.legend { columns: 2 320px; padding-left: 18px; font-size: 14.5px; margin: 8px 0 14px; }
.cid { display: inline-block; }

footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 20px 40px; }

@media (max-width: 760px) {
  body { font-size: 16.5px; }
  .brand { font-size: 17px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; width: 100%; }
  .tab { padding: 6px 10px; font-size: 14px; white-space: nowrap; }
  .stepname { padding: 4px 14px 8px; }
  .steps { padding: 0 14px; }
  main { padding: 16px 14px 70px; }
  .thead { display: none; }
  details.row summary { grid-template-columns: 30px 1fr 44px 56px; grid-template-areas: "rk nm sc traj" "strip strip strip strip" "tags tags tags tags"; row-gap: 6px; }
  details.row summary .traj { grid-area: traj; }
  details.row summary .rk { grid-area: rk; }
  details.row summary .nm { grid-area: nm; }
  details.row summary .sc { grid-area: sc; }
  details.row summary .strip { grid-area: strip; }
  details.row summary .tags { grid-area: tags; }
  .detail { grid-template-columns: 1fr; padding-left: 14px; }
  .setrow { grid-template-columns: 1fr 52px 52px; }
  .bar { padding: 8px 14px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

@media print {
  body { background: #fff; color: #000; font-size: 12pt; }
  #chrome, .nav, .actions, .weights, textarea.sum, footer, .cmpsel { display: none !important; }
  .wide, .narrow { max-width: none; }
  details.row summary:hover { background: none; }
  .detail { grid-template-columns: repeat(3, 1fr); }
  .panel { break-inside: avoid; }
  details.row { break-inside: avoid; }
}

/* v2 additions */
.tag.strain { background: var(--hema-soft); color: var(--hema); }
.traj { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
.traj i { display: block; width: 10px; background: var(--hema); border-radius: 2px 2px 0 0; opacity: 0.85; }
.traj i:nth-child(1) { opacity: 0.45; }
.traj i:nth-child(2) { opacity: 0.65; }
.stages { margin: 20px 0; padding: 16px 20px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.stgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
.stgrid b { display: block; font-family: var(--f-ui); font-size: 15px; }
.stgrid small { color: var(--muted); font-size: 13.5px; }
.sectors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 14px 12px 6px 46px; background: var(--surface); border-top: 1px dashed var(--line); }
.voices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 6px 12px 22px 46px; background: var(--surface); }
.sectors p, .voices p { font-size: 14.5px; margin: 0; }
.sectors h4, .voices h4 { margin-top: 4px; }
.setrow.three { grid-template-columns: 1fr 56px 56px 56px; }
.checks.two { grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.detail ul.age { list-style: none; padding-left: 0; }
.detail ul.age li { margin-bottom: 3px; }
@media (max-width: 760px) {
  .sectors, .voices { grid-template-columns: 1fr; padding-left: 14px; }
  .setrow.three { grid-template-columns: 1fr 44px 44px 44px; }
  .checks.two { grid-template-columns: 1fr; }
}
@media print {
  .sectors { grid-template-columns: repeat(4, 1fr); }
  .voices { grid-template-columns: repeat(2, 1fr); }
}

.weights summary { cursor: pointer; list-style: none; }
.weights summary::-webkit-details-marker { display: none; }
.weights summary h3 { display: inline; }
.weights summary::after { content: " (show or hide)"; font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
.chk input { flex: 0 0 17px; }

</style>
</head>
<body>
<header id="chrome"></header>
<main id="app"></main>
<footer>Decision aid, version 0.2. Branch profiles are judgement informed by cited sources and doctors' own accounts, not validated data. Not counselling advice.</footer>
<script>
/* ===== DATA (core numbers) ===== */
var DATA = {};
DATA.version = "0.2";

/* Branch order is fixed: every matrix uses it. */
DATA.branches = [
  { id: "MED",    name: "General Medicine",             short: "Medicine",      deg: "MD" },
  { id: "SURG",   name: "General Surgery",              short: "Surgery",       deg: "MS" },
  { id: "OBG",    name: "Obstetrics & Gynaecology",     short: "OBG",           deg: "MS/MD" },
  { id: "PEDS",   name: "Paediatrics",                  short: "Paediatrics",   deg: "MD" },
  { id: "ORTHO",  name: "Orthopaedics",                 short: "Orthopaedics",  deg: "MS" },
  { id: "ANES",   name: "Anaesthesiology",              short: "Anaesthesia",   deg: "MD" },
  { id: "RAD",    name: "Radiodiagnosis",               short: "Radiology",     deg: "MD" },
  { id: "DERM",   name: "Dermatology, Venereology & Leprosy", short: "Dermatology", deg: "MD" },
  { id: "PSY",    name: "Psychiatry",                   short: "Psychiatry",    deg: "MD" },
  { id: "OPH",    name: "Ophthalmology",                short: "Ophthalmology", deg: "MS" },
  { id: "ENT",    name: "Otorhinolaryngology (ENT)",    short: "ENT",           deg: "MS" },
  { id: "EM",     name: "Emergency Medicine",           short: "Emergency Med", deg: "MD" },
  { id: "RESP",   name: "Respiratory Medicine (TB & Chest)", short: "Respiratory", deg: "MD" },
  { id: "RT",     name: "Radiotherapy / Radiation Oncology", short: "Radiotherapy", deg: "MD" },
  { id: "PATH",   name: "Pathology",                    short: "Pathology",     deg: "MD" },

  /* ---------- method ---------- */
  function methodHtml() {
    var h = '<section class="narrow prose"><h1>Method and sources</h1>';
    h += "<h2>What this is</h2><p>A decision aid for choosing among 22 MD/MS branch groups as they work in India. It ignores your NEET-PG rank on purpose: it asks which branch is right for you, not which one you can get. It is not a validated psychometric test. The branch profiles are structured judgement informed by the sources below, not a survey of practitioners. Use it to widen what you consider, expose trade-offs, and decide what to verify by shadowing.</p>";

    h += "<p>The aim is a branch you will still belong in, not one that feels perfect before you begin. Three ideas shape the design.</p><ul>";
    h += "<li><b>Fit predicts what happens later.</b> In a meta-analysis of 172 studies, person-job fit correlated with job satisfaction (about .56) and with intent to quit (about -.46), and fit with the group and supervisor mattered as well [[kristof]]. So the report scores task fit, temperament fit, and identity fit, and the checks are about people as well as tasks.</li>";
    h += "<li><b>Wants change and forecasts are biased.</b> People overestimate how intensely and how long a salient feature will matter to them [[wilson]]. The report therefore scores residency, early consultant years, mid-career and late career separately, with different emphasis at each stage (below). The long-run score is 55% time-weighted average and 45% weakest stage, so a branch cannot hide a bad stage behind a good one.</li>";
    h += "<li><b>A wrong branch is costly to reverse in India.</b> Seat-leaving bonds reach Rs 20 lakh in some states and 1,120 PG residents dropped out in five years [[nmcbond]]. In one Indian study, burnout was high (52.6%) among residents not allotted their preferred specialty [[burnsurg]]. That supports getting the fit right before the seat, though it does not show that mismatch causes burnout.</li></ul>";
    h += '<div class="scroll"><table class="tbl wrapt"><thead><tr><th>Stage</th><th>Weight in time</th><th>What counts most</th></tr></thead><tbody>';
    var stagesWhat = {
      res: "Limits (residency hours, night duty), temperament under pressure, the work itself. Career path and age count little.",
      early: "Career path and practice model, income timing, capital and hospital dependence, training overhang, values.",
      mid: "The work itself, values, temperament, identity, robustness against saturation and automation, growing physical load.",
      late: "Age effects: physical and sensory load, room to change role, night calls at 60, values such as time control, and identity."
    };
    D.stages.forEach(function (s) { h += "<tr><td><b>" + esc(s.name) + "</b><br><small>" + esc(s.span) + "</small></td><td>" + Math.round(s.t * 100) + "%</td><td>" + esc(stagesWhat[s.id]) + "</td></tr>"; });
    h += "</tbody></table></div>";

    h += "<h2>How age is treated</h2><p>Studies of surgeon age find modest average differences in outcomes that vary between people and shrink with high case volume [[surgage]][[surgage2]]. A study of US hospital physicians found a similar pattern [[tsugawa]], and a surgical college's review calls the literature thin [[racs]]. So the tool does not predict decline. It scores how much each branch relies on physical, fine-motor or sensory capacity (Indian surveys report work-related musculoskeletal disorders in about 82% of orthopaedic surgeons [[msdortho]] and about 75% of ophthalmologists [[msdoph]]), how much standing grows with experience, how easily you can scale down after 55, how fast knowledge changes, how slowly income builds, and how much you need a big centre. Central-government specialists retire at 65 [[retire]]; private practice has no fixed age.</p>";

    h += "<h2>Where India differs from imported advice</h2>";
    h += '<div class="scroll"><table class="tbl wrapt"><thead><tr><th>Topic</th><th>In India</th></tr></thead><tbody>';
    var diffs = [
      ["Surgical income", "Insurance package rates fix the surgeon's fee inside the bundle [[pmjay]]; 609 private hospitals opted out of the scheme [[optout]]; knee-implant and stent prices were capped in 2017 [[nppa]][[stent]]; small nursing homes close as chains expand [[fin]]. The higher pay tier belongs to super-specialists [[sal]]. Do not assume US surgeon earnings."],
      ["Emergency medicine", "Few trained specialists and rising demand [[emindia]], in contrast to a projected US surplus [[emus]]."],
      ["Anaesthesia", "About 1.3 to 4 physician anaesthesiologists per 100,000 against a suggested 5; at least 60,000 more needed [[anes]]. Government districts advertise contractual posts [[walkin]]."],
      ["Dermatology", "About 9.5 per million, concentrated in cities [[derm]], yet a crowded metro aesthetic market with unlicensed competitors [[idoj]]; few government posts [[mediumderm]]."],
      ["Radiology", "About 1 radiologist per 100,000 [[radlancet]]; final-year residents are drawn to senior residency, fellowships and DM [[irad]]."],
      ["Public specialist posts", "About 79.5% of CHC specialist posts are unfilled [[rhs]]; 67% of sanctioned posts are vacant [[healthdyn]]. Governments hire contractual specialists by walk-in [[walkin]]."],
      ["Resident hours", "The 1992 scheme's 48-hour week is not enforced; the NMC task force suggested at most 74 [[duty]]; the Supreme Court matter is listed for 27 Oct 2026 [[duty2]]. Pooled burnout among Indian PG residents is about 51% [[burnpg]]; OBG, general surgery and orthopaedics were highest in one Indian study [[burnsurg]]."],
      ["Violence", "48% of physicians reported violence in a Karnataka tertiary-care study [[viol]]; 24 states have laws, and the National Task Force found no need for a separate central law [[ntf]]."],
      ["Retirement", "Central-government specialists retire at 65 [[retire]]; private practice has no fixed age."]
    ];
    diffs.forEach(function (r) { h += "<tr><td><b>" + esc(r[0]) + "</b></td><td>" + linkRefsFix(r[1]) + "</td></tr>"; });
    h += "</tbody></table></div>";
    h += "<p>Income needs a caution: there is no national dataset of specialty income in India. Commercial salary guides disagree widely, so the tool uses only ordinal tiers: private above government after about five years, independent practice slow to ramp, and super-specialists in a much higher tier [[sal]].</p>";

    h += "<h2>Government, private, and what doctors say online</h2>";
    h += "<p>Each branch profile (open a row in the report) lists the government, corporate, independent and academic picture, then a \"what you will hear\" line and a reality check. The forum material comes from Careers360's community answers and news that quotes doctors' public posts [[c360toppers]][[c360rad]][[c360jipmer]], Quora answers, blogs by practising doctors [[mediumderm]], and Indian journal commentaries [[ijdvl_fate]][[idoj]][[irad]]. I could not query Reddit directly. These voices are anecdotal: they show what people believe and repeat, which is useful for spotting the gap between the image and the reality, but they say nothing about how common an experience is. Where a claim rests on a forum post, the report says so.</p>";

    h += "<h2>Design choices and the evidence behind them</h2>";
    h += '<div class="scroll"><table class="tbl wrapt"><thead><tr><th>Choice</th><th>Why</th><th>Evidence quality</th></tr></thead><tbody>';
    var rows = [
      ["Items describe what specialists do in a week", "An inventory built on practitioners' medical activities classified later specialty choice correctly about 46 to 59% of the time in US samples, while a generic student-interest scale managed about 19% [[mspi]][[mspi2]]. The inventory's factor structure is weak, so treat scores as prompts [[mspi3]].", "Moderate: older, US, one instrument."],
      ["Personality as a small input, work style as a larger one", "Big Five differences between specialties are small and inconsistent [[perBMC]]; in an Indian sample surgical choosers were more extraverted and conscientious with fewer negative emotions [[perIndia]][[surgpers]]. The 20 Mini-IPIP items are public domain [[ipip]]. Work-style items ask about capacities the work demands (composure, stamina, tolerance of uncertainty) because those bear on strain more than trait labels.", "Weak to moderate; treat as prompts."],
      ["Values chosen by best-worst sets, not rated", "Rating importance tends to make everything important. Forced best/worst choices spread items out [[maxdiff]]. Nine sets, each value shown three times, every pair of values together at most once.", "Moderate: standard in choice research."],
      ["Concrete single-idea items, shuffled order, a 'no idea' option", "Standard survey-design guidance [[krosnick]][[jebb]].", "Strong: methodological consensus."],
      ["Preferences without your rank", "Anticipating what you can get can bend what you say you want.", "Design judgement."],
      ["Identity through 'who you'd be at 50'", "Role models and clinical experience are the most frequently reported influences on specialty preference [[intracurr]]; fit with a group of colleagues matters for satisfaction [[kristof]].", "Moderate."],
      ["Lifestyle weighed separately from income", "In US match data, controllable lifestyle explained 55% of variation in specialty preference after adjusting for income, hours and training length [[dorsey]]; systematic reviews put lifestyle and interest among leading drivers [[levaillant]][[subspec]]; an Indian sample found personal growth, professional growth and satisfaction [[anand]].", "Strong association; partly US."],
      ["Deal-breakers scored as limits and strain, with a penalty", "Burnout and career-choice regret track work conditions [[dyrbye]]. A clash with something you said you could not live with should not be averaged away.", "Moderate: US residents."],
      ["Your lean captured first, then compared", "In a Finnish national survey, choosing by chance went with dissatisfaction, while diversity of work went with satisfaction [[finnish]].", "Moderate."],
      ["Expectation check", "Shows the gap between the picture of a branch in your head and its usual week; the forecasting literature gives a reason to expect such gaps [[wilson]].", "Design judgement."],
      ["Ranking shown with a range", "Profiles are judgement, so the report perturbs weights and adds noise to sub-scores 300 times and shows where the ranking is fragile.", "Design judgement, disclosed."]
    ];
    rows.forEach(function (r) { h += "<tr><td><b>" + esc(r[0]) + "</b></td><td>" + linkRefsFix(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>"; });
    h += "</tbody></table></div>";

    h += "<h2>How scores are computed</h2><ul>";
    h += "<li><b>Daily work.</b> Each activity item is rated 1 to 5. A task dimension's score is the mean of its two items, blended half and half between your absolute rating (centred on 3) and how it sits against your own average. The branch fit is the profile-weighted average across 15 dimensions; at each stage some tasks count more or less (operating counts less late in a career, teaching and chronic care more).</li>";
    h += "<li><b>Career values.</b> For each value: (times chosen most minus times chosen least) divided by times shown, plus 1. The branch fit is the weighted average of its 1 to 5 delivery scores.</li>";
    h += "<li><b>Temperament.</b> 13 work-style items. For capacity items (composure, stamina, tolerance of uncertainty, unpredictable days, other people's distress, angry people) a shortfall against the branch's demand counts; for preference items (solitude, people contact, patience, precision, variety, autonomy, teamwork) any mismatch counts. 15% comes from the Big Five leaning of people who choose the branch. A shortfall of 2 or more on a capacity item you rate 0 or 1 subtracts 6 points at that stage, up to 18.</li>";
    h += "<li><b>Limits.</b> Each of 8 features gets your 0 to 4 aversion times the branch's 0 to 4 loading, with stage multipliers (residency hours only in residency, physical strain and night calls more late in life, capital and training overhang in the early years). A clash (aversion 4 with loading 3 or more, or aversion 3 with loading 4) subtracts 10 points at that stage, up to 30.</li>";
    h += "<li><b>Age and life stage.</b> Your answers weight six branch attributes (physical dependence, growth with experience, room to scale down, knowledge churn, slow income ramp, need for a big centre), with stage multipliers.</li>";
    h += "<li><b>Career path, robustness, identity.</b> Path is your importance times the branch's viability across seven models. Robustness blends demand and automation exposure by your stance on AI. Identity uses the 12 'who I'd be at 50' descriptions and the branch's loadings on them.</li>";
    h += "<li><b>Combining.</b> Each part is stretched to 0 to 100 across the 22 branches, then combined with your weights, stage emphasis, and a signal factor that lowers a part's weight when your answers in it were flat.</li></ul>";

    h += "<h2>Known limits</h2><ul>";
    h += "<li>Branch profiles are my synthesis, not measured data. Calibrate the ones you care about: have two residents and a consultant per shortlisted branch rate them, then edit the numbers under Assumptions. Personality and identity profiles are the least evidence-based.</li>";
    h += "<li>Indian specialty-level data on income, hours and satisfaction is scarce; where I could not find Indian evidence I say so. Burnout and regret evidence outside the Indian studies listed is mostly from the US [[dyrbye]].</li>";
    h += "<li>Automation exposure rests on one preprint for radiology [[ai]] and judgement elsewhere.</li>";
    h += "<li>Super-specialty feeder lists come from a secondary summary [[ss]]; confirm in the current NBEMS bulletin.</li>";
    h += "<li>Government, corporate and independent notes describe typical patterns; states differ, for example in whether government specialists may practise privately [[npa]].</li></ul>";

    h = linkifyAll(D.fix(h));
    h += '<h2>Sources</h2><ol class="sources">';
    D.sources.forEach(function (s) { h += '<li id="src-' + s.id + '" value="' + s.id + '"><a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(s.t) + "</a><br><small>" + esc(s.n) + "</small></li>"; });
    return h + "</ol></section>";
  }
  function linkRefsFix(t) { return linkRefs(D.fix(t)); }
  function methodFix(h) { return h; }

  /* ---------- assumptions ---------- */
  var ASSUMP_TABS = [
    { id: "task", label: "Daily work", kind: "task", dims: function () { return D.taskDims; }, min: 0, max: 3, help: "Share of the branch's typical work in each activity: 0 none, 3 dominant." },
    { id: "value", label: "Values", kind: "value", dims: function () { return D.values; }, min: 1, max: 5, help: "How well the branch typically delivers each value in India: 1 poorly, 5 very well." },
    { id: "expos", label: "Limits", kind: "expos", dims: function () { return D.expos; }, min: 0, max: 4, help: "How strongly typical practice features each burden: 0 not at all, 4 defining." },
    { id: "style", label: "Temperament demands", kind: "style", dims: function () { return D.style; }, min: 0, max: 4, help: "How much the work demands or offers of each temperament dimension (S1 to S6 are capacities, S7 to S13 preferences): 0 none, 4 a lot." },
    { id: "trait", label: "Trait leanings", kind: "trait", dims: function () { return D.traits; }, min: 0, max: 4, help: "Leaning of people who choose or practise the branch, 0 low to 4 high; 2 means no lean. Low confidence." },
    { id: "arch", label: "Identity", kind: "arch", dims: function () { return D.archs; }, min: 0, max: 3, help: "How strongly the branch lets you become each 'who I'd be at 50' description." },
    { id: "fut", label: "Career paths", kind: "fut", dims: function () { return D.futs; }, min: 0, max: 4, help: "How viable the branch makes each path: 0 not viable, 4 very viable." },
    { id: "attrs", label: "Robustness and age", kind: "attrs", dims: null, min: 0, max: 4, help: "Demand outlook, automation exposure, metro saturation, physical dependence, growth with experience, room to scale down, knowledge churn, slow income ramp, need for a big centre (all 0 to 4)." }
  ];
  var ATTR_COLS = [
    { id: "demand", name: "Demand" }, { id: "ai", name: "Automation" }, { id: "sat", name: "Metro saturation" }, { id: "phys", name: "Physical dependence" },
    { id: "exp", name: "Growth with experience" }, { id: "flex", name: "Scale down later" }, { id: "churn", name: "Knowledge churn" }, { id: "ramp", name: "Slow income ramp" }, { id: "loc", name: "Needs big centre" }
  ];
  var assumpTab = "task";
  var KEYMAP = { task: "taskM", value: "valueM", expos: "exposM", fut: "futM", style: "styleM", trait: "traitM", arch: "archM" };

  function assumpHtml() {
    var tab = ASSUMP_TABS.filter(function (t) { return t.id === assumpTab; })[0];
    var h = '<section class="wide"><h1>Assumptions</h1><p class="lede">These are the branch profiles the report scores against. They are judgement informed by the cited sources. Change any cell you disagree with, for example after talking to residents. Changed cells are marked, and the report updates.</p>';
    h += '<div class="subtabs">';
    ASSUMP_TABS.forEach(function (t) { h += '<button class="tab' + (t.id === assumpTab ? " on" : "") + '" data-act="atab" data-t="' + t.id + '">' + t.label + "</button>"; });
    h += '</div><p class="hint">' + esc(tab.help) + '</p><div class="actions"><button class="btn quiet" data-act="aresetall">Reset all edits</button></div>';
    var cols = tab.id === "attrs" ? ATTR_COLS : tab.dims();
    if (tab.id !== "attrs") {
      h += '<ul class="legend">';
      cols.forEach(function (c) { h += "<li><b>" + esc(c.id) + "</b> " + esc(c.name) + "</li>"; });
      h += "</ul>";
    }
    h += '<div class="scroll"><table class="grid"><thead><tr><th>Branch</th>';
    cols.forEach(function (c) { h += '<th title="' + esc(c.name) + '"><span class="cid">' + (tab.id === "attrs" ? esc(c.name) : esc(c.id)) + "</span></th>"; });
    h += "</tr></thead><tbody>";
    D.branches.forEach(function (b) {
      h += '<tr><th scope="row">' + esc(b.short) + "</th>";
      cols.forEach(function (c, i) {
        var def, cur;
        if (tab.id === "attrs") { def = D.attrs[b.id][c.id]; cur = E.attrs(state, b.id)[c.id]; }
        else { def = D[KEYMAP[tab.kind]][b.id][i]; cur = E.row(state, tab.kind, b.id)[i]; }
        var edited = cur !== def;
        h += '<td><input class="cell' + (edited ? " ed" : "") + '" type="number" min="' + tab.min + '" max="' + tab.max + '" step="1" value="' + cur + '" data-k="cell" data-kind="' + tab.kind + '" data-b="' + b.id + '" data-i="' + (tab.id === "attrs" ? c.id : i) + '" aria-label="' + esc(b.short + ", " + c.name) + '"></td>';
      });
      h += "</tr>";
    });
    return h + "</tbody></table></div></section>";
  }

  /* ---------- rendering ---------- */
  function render(keepScroll) {
    renderChrome();
    var h;
    if (state.view === "start") h = startHtml();
    else if (state.view === "q") h = qHtml();
    else if (state.view === "results") h = resultsHtml();
    else if (state.view === "method") h = methodHtml();
    else h = assumpHtml();
    app.innerHTML = h;
    if (!keepScroll) { try { if (typeof window.scrollTo === "function") window.scrollTo(0, 0); } catch (e) {} }
  }

  function refreshResults() {
    var body = document.getElementById("res-body");
    if (!body) return;
    var sc = E.score(state);
    body.innerHTML = resultsBody();
    E.COMPS.forEach(function (c) { var o = document.querySelector('output[data-eff="' + c + '"]'); if (o) o.textContent = fmt(sc.effPct[c]) + "%"; });
    var s = document.getElementById("sumtxt"); if (s) s.value = E.summaryText(state);
  }

  function refreshProgress() {
    var pr = E.progress(state), el = document.querySelector(".stepname span");
    if (el) el.textContent = "Screen " + (state.screen + 1) + " of " + SCREENS.length + ", " + pr.pct + "% answered";
  }

  /* ---------- events ---------- */
  function syncArch() {
    var a = state.arch, ins = document.querySelectorAll('input[data-k="arch1"],input[data-k="arch2"],input[data-k="archw"]'), i, x;
    for (i = 0; i < ins.length; i++) {
      x = ins[i];
      if (x.dataset.k === "arch1") x.checked = a.best[0] === x.value;
      else if (x.dataset.k === "arch2") x.checked = a.best[1] === x.value;
      else x.checked = a.worst === x.value;
    }
  }

  function onChange(e) {
    var t = e.target, k = t.dataset && t.dataset.k;
    if (!k) return;
    var v = t.value, n = parseInt(v, 10), id = t.dataset.id;
    if (k === "act") state.acts[id] = n;
    else if (k === "best" || k === "worst") {
      var s = parseInt(t.dataset.s, 10), md = state.md[s] || (state.md[s] = {}), other = k === "best" ? "worst" : "best";
      md[k] = n;
      if (md[other] === n) { md[other] = null; var o = document.querySelector('input[name="' + other + "-" + s + '"]:checked'); if (o) o.checked = false; }
    }
    else if (k === "av") state.av[id] = n;
    else if (k === "big5") state.big5[id] = n;
    else if (k === "style") state.style[id] = n;
    else if (k === "ag") state.ag[id] = n;
    else if (k === "arch1" || k === "arch2" || k === "archw") {
      var a = state.arch;
      if (!a.best) a.best = [];
      if (k === "archw") {
        a.worst = v;
        if (a.best[0] === v) a.best[0] = null;
        if (a.best[1] === v) a.best[1] = null;
      } else {
        var ix = k === "arch1" ? 0 : 1, ox = 1 - ix;
        a.best[ix] = v;
        if (a.best[ox] === v) a.best[ox] = null;
        if (a.worst === v) a.worst = null;
      }
      syncArch();
    }
    else if (k === "expect") {
      var bid = t.dataset.b, d = parseInt(t.dataset.d, 10), arr = state.expect[bid] || (state.expect[bid] = []), pos = arr.indexOf(d);
      if (t.checked) {
        if (arr.length >= 3) { t.checked = false; return; }
        if (pos < 0) arr.push(d);
      } else if (pos >= 0) arr.splice(pos, 1);
    }
    else if (k === "fut") state.fut[id] = n;
    else if (k === "ai") state.ai = n;
    else if (k === "fp") { state.fp = n; state.weights.fut = [2, 4, 6, 10, 14][n]; }
    else if (k === "geo") state.geo[id] = t.checked;
    else if (k === "pick") { state.prior.picks[parseInt(t.dataset.i, 10)] = v; }
    else if (k === "reason") { var ri = state.prior.reasons.indexOf(id); if (t.checked && ri < 0) state.prior.reasons.push(id); if (!t.checked && ri >= 0) state.prior.reasons.splice(ri, 1); }
    else if (k === "conf") state.prior.conf = n;
    else if (k === "exp") state.real.exp[id] = v;
    else if (k === "pm") { state.pm = v; }
    else if (k === "w") { state.weights[t.dataset.c] = n; refreshResults(); }
    else if (k === "cmp") { if (t.dataset.w === "A") cmpA = v; else cmpB = v; refreshResults(); }
    else if (k === "cell") { onCell(t); }
    else return;
    refreshProgress();
    save();
  }

  function onCell(t) {
    var kind = t.dataset.kind, b = t.dataset.b, i = t.dataset.i, v = parseInt(t.value, 10);
    var min = parseInt(t.min, 10), max = parseInt(t.max, 10);
    if (isNaN(v)) v = min;
    v = E.clamp(v, min, max); t.value = v;
    if (kind === "attrs") {
      var def = D.attrs[b][i], cur = state.edits.attrs[b] || {};
      if (v === def) delete cur[i]; else cur[i] = v;
      if (Object.keys(cur).length) state.edits.attrs[b] = cur; else delete state.edits.attrs[b];
      t.classList.toggle("ed", v !== def);
    } else {
      var dflt = D[KEYMAP[kind]][b], rowCopy = (state.edits[kind][b] || dflt).slice(), idx = parseInt(i, 10);
      rowCopy[idx] = v;
      var same = rowCopy.every(function (x, j) { return x === dflt[j]; });
      if (same) delete state.edits[kind][b]; else state.edits[kind][b] = rowCopy;
      t.classList.toggle("ed", v !== dflt[idx]);
    }
  }

  function go(view, screen) {
    state.view = view;
    if (screen !== undefined) state.screen = screen;
    save(); render();
  }

  var pendingBtn = null, pendingTimer = null, pendingLabel = "";
  function twice(btn, msg) {
    if (pendingBtn === btn) { clearTimeout(pendingTimer); pendingBtn = null; return true; }
    if (pendingBtn) { pendingBtn.textContent = pendingLabel; }
    pendingBtn = btn; pendingLabel = btn.textContent; btn.textContent = msg;
    pendingTimer = setTimeout(function () { if (pendingBtn === btn) { btn.textContent = pendingLabel; pendingBtn = null; } }, 4000);
    return false;
  }

  function onClick(e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) return;
    var a = t.dataset.act;
    if (a === "view") { e.preventDefault(); go(t.dataset.v); }
    else if (a === "begin") go("q", 0);
    else if (a === "resume") go("q", Math.min(state.screen || 0, SCREENS.length - 1));
    else if (a === "reset") { if (twice(t, "Click again to clear all answers and profile edits")) { state = E.defaultState(); try { localStorage.removeItem(LS); } catch (er) {} render(); } }
    else if (a === "next") go("q", Math.min(state.screen + 1, SCREENS.length - 1));
    else if (a === "back") go("q", Math.max(state.screen - 1, 0));
    else if (a === "goto") go("q", parseInt(t.dataset.i, 10));
    else if (a === "results") go("results");
    else if (a === "theme") toggleTheme();
    else if (a === "wreset") { state.weights = E.defaultWeights(); save(); render(true); }
    else if (a === "atab") { assumpTab = t.dataset.t; render(true); }
    else if (a === "aresetall") { if (twice(t, "Click again to reset every edit")) { state.edits = E.defaultEdits(); save(); render(true); } }
    else if (a === "src") {
      e.preventDefault(); var n = t.dataset.n; go("method");
      setTimeout(function () { var el = document.getElementById("src-" + n); if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: "center" }); } catch (er) {} el.classList.add("flash"); } }, 30);
    }
    else if (a === "copy") {
      var ta = document.getElementById("sumtxt"), msg = document.getElementById("copied");
      var done = function (ok) { if (msg) msg.textContent = ok ? "Copied." : "Select the text and copy it manually."; };
      ta.select();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { try { done(document.execCommand("copy")); } catch (er) { done(false); } });
        else done(document.execCommand("copy"));
      } catch (er) { done(false); }
    }
    else if (a === "print") { openAll(); try { window.print(); } catch (er) {} }
  }

  function openAll() { var ds = document.querySelectorAll("details.row"), i; for (i = 0; i < ds.length; i++) ds[i].open = true; }

  function onToggle(e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains("row") && t.dataset.id) openIds[t.dataset.id] = t.open;
  }

  function toggleTheme() {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(TH, next); } catch (e) {}
  }

  function init() {
    app = document.getElementById("app"); chrome = document.getElementById("chrome");
    try { var th = localStorage.getItem(TH); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
    app.addEventListener("change", onChange);
    app.addEventListener("input", function (e) { var k = e.target.dataset && e.target.dataset.k; if (k === "pm" || k === "w") onChange(e); });
    document.addEventListener("click", onClick);
    app.addEventListener("toggle", onToggle, true);
    window.addEventListener("beforeprint", openAll);
    render();
  }

  return { init: init, _state: function () { return state; }, _render: render };
})();

if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { App.init(); });
  else App.init();
}

</script>
</body>
